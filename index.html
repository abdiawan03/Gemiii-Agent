<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemiii AI App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400">Gemiii AI Assistant</h1>
        <span class="text-xs text-green-400 bg-green-900 px-3 py-1 rounded-full font-semibold">Active & Ready</span>
    </header>

    <!-- Chat Box -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm shadow">
                Hello! Main aapka AI assistant hoon. Aap mujhse koi bhi sawal pooch sakte hain.
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-gray-800 p-4 shadow-inner">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Yahan apna message likhein..." class="flex-1 bg-gray-700 px-4 py-2 rounded-lg outline-none border border-gray-600 focus:border-blue-400 text-sm">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg font-semibold text-sm transition">Send</button>
        </div>
    </footer>

    <script>
        // Aap ki API key yahan successfully configure kar di gayi hai
        const API_KEY = "AIzaSyC1NzNjaXT8b_o4qNqg1jkNRzAUqRV80iw";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const chatContainer = document.getElementById('chatContainer');

            if (!messageText) return;

            // Display User Message
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-600 p-3 rounded-lg max-w-[80%] text-sm shadow">${escapeHtml(messageText)}</div>
                </div>
            `;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm text-gray-400 italic shadow">Thinking...</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: messageText }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `
                        <div class="flex justify-start">
                            <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm shadow whitespace-pre-wrap">${escapeHtml(aiReply)}</div>
                        </div>
                    `;
                } else {
                    const errorMsg = data.error ? data.error.message : "Invalid API response.";
                    chatContainer.innerHTML += `
                        <div class="flex justify-start">
                            <div class="bg-red-900 p-3 rounded-lg max-w-[80%] text-sm shadow">Error: ${escapeHtml(errorMsg)}</div>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-900 p-3 rounded-lg max-w-[80%] text-sm shadow">Network Error: Kuch masla ho gaya hai.</div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
